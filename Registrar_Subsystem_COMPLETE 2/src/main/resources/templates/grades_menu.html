<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Select Class | Grades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/modern-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="wrapper">
        <nav id="sidebar">
            <div class="sidebar-header"><span class="sidebar-brand">EAC REGISTRAR</span></div>
            <ul class="list-unstyled components">
                <li><a href="/"><i class="fas fa-home sidebar-icon"></i> Dashboard</a></li>
                <li class="active"><a href="/grades"><i class="fas fa-marker sidebar-icon"></i> Grade Sheet</a></li>
                <li><a href="/logout"><i class="fas fa-sign-out-alt sidebar-icon"></i> Logout</a></li>
            </ul>
        </nav>

        <div id="content">
            <nav class="top-navbar">
                <button id="sidebarCollapse" class="btn-toggle"><i class="fas fa-bars"></i></button>
                <span class="fw-bold fs-5">Grade Management</span>
            </nav>

            <div class="container-fluid p-4">
                <div class="alert alert-light border-start border-5 border-danger shadow-sm mb-4">
                    <h5 class="mb-0 text-dark">Select a Class</h5>
                    <small class="text-muted">Manage grades for your assigned subjects below.</small>
                </div>

                <div class="row g-4">
                    <div class="col-md-4" th:each="c : ${classes}">
                        <div class="card card-modern h-100">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start mb-3">
                                    <div>
                                        <h4 class="fw-bold text-danger mb-0" th:text="${c.course_code}"></h4>
                                        <span class="badge bg-secondary" th:text="'Section ' + ${c.section}"></span>
                                    </div>
                                    <div class="bg-light rounded p-2 text-center">
                                        <strong th:text="${c.enrolled_count}"></strong><br>
                                        <small style="font-size:10px">STUDENTS</small>
                                    </div>
                                </div>
                                
                                <p class="text-muted small mb-3">
                                    <i class="far fa-clock me-1"></i> <span th:text="${c.pretty_schedule}"></span>
                                </p>

                                <a th:href="@{'/grades/view/' + ${c.schedule_id}}" class="btn btn-outline-danger w-100">
                                    Open Grade Sheet <i class="fas fa-arrow-right ms-2"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-12 text-center mt-5" th:if="${classes.empty}">
                        <p class="text-muted">No classes assigned to you.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script><script src="/js/main.js"></script>
</body>
</html>
