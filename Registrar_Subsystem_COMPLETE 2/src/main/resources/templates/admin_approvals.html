<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Approvals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/modern-style.css">
</head>
<body>
    <div class="wrapper">
        <nav id="sidebar">
            <div class="sidebar-header"><span class="sidebar-brand">EAC REGISTRAR</span></div>
            <ul class="list-unstyled components">
                <li><a href="/"><i class="fas fa-home sidebar-icon"></i> Dashboard</a></li>
                <li><a href="/admin"><i class="fas fa-user-shield sidebar-icon"></i> Users</a></li>
                <li class="active"><a href="/admin/approvals"><i class="fas fa-check-circle sidebar-icon"></i> Approvals</a></li>
                <li><a href="/admin/classes"><i class="fas fa-chalkboard-teacher sidebar-icon"></i> Classes</a></li>
                <li><a href="/logout"><i class="fas fa-sign-out-alt sidebar-icon"></i> Logout</a></li>
            </ul>
        </nav>

        <div id="content">
            <nav class="top-navbar">
                <button id="sidebarCollapse" class="btn-toggle"><i class="fas fa-bars"></i></button>
                <span class="fw-bold fs-5">Pending Approvals</span>
            </nav>

            <div class="container-fluid p-4">
                
                <div class="card card-modern p-4 mb-4">
                    <h5 class="text-primary"><i class="fas fa-user-plus"></i> Enrollment Requests</h5>
                    <p class="text-muted small">Students awaiting validation.</p>
                    
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Student</th>
                                    <th>Course Code</th>
                                    <th>Section</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="e : ${enrollments}">
                                    <td><strong th:text="${e.real_name}"></strong></td>
                                    <td><span class="badge bg-info text-dark" th:text="${e.course_code}"></span></td>
                                    <td th:text="${e.section}"></td>
                                    <td>
                                        <form action="/admin/approve-enrollment" method="post">
                                            <input type="hidden" name="detailId" th:value="${e.detail_id}">
                                            <button class="btn btn-sm btn-success">
                                                <i class="fas fa-check"></i> Approve
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(enrollments)}">
                                    <td colspan="4" class="text-center text-muted py-3">No pending enrollments.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="card card-modern p-4">
                    <h5 class="text-danger"><i class="fas fa-edit"></i> Grade Rectifications</h5>
                    
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Faculty</th>
                                    <th>Student</th>
                                    <th>Change</th>
                                    <th>Reason</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="r : ${gradeRequests}">
                                    <td th:text="${r.faculty}"></td>
                                    <td th:text="${r.student_name}"></td>
                                    <td>
                                        <span class="text-decoration-line-through text-muted" th:text="${r.old_grade}"></span>
                                        <i class="fas fa-arrow-right mx-1 small"></i>
                                        <strong class="text-success" th:text="${r.new_grade}"></strong>
                                    </td>
                                    <td th:text="${r.reason}" class="text-muted fst-italic"></td>
                                    <td>
                                        <form action="/admin/approve-grade" method="post">
                                            <input type="hidden" name="requestId" th:value="${r.request_id}">
                                            <button class="btn btn-sm btn-danger">
                                                <i class="fas fa-check-double"></i> Rectify
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(gradeRequests)}">
                                    <td colspan="5" class="text-center text-muted py-3">No pending grade requests.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
